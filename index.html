<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat IA AriaVex Premium</title>
<style>
    body {
        margin: 0;
        font-family: 'Arial', sans-serif;
        height: 100vh;
        background: url('https://cdn.onlyfans.com/profile_images/ariiavex.jpg') no-repeat center center/cover;
        color: #fff;
        position: relative;
        overflow: hidden;
    }
    body::after {
        content: "";
        position: absolute;
        top:0; left:0; width:100%; height:100%;
        background: linear-gradient(135deg, rgba(255,0,255,0.3), rgba(0,255,255,0.3));
        z-index: 0;
        pointer-events: none;
    }
    .container {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        height: 100%;
        justify-content: flex-end;
        align-items: center;
        padding: 20px;
        backdrop-filter: blur(5px);
    }
    #chat {
        width: 90%;
        max-width: 500px;
        height: 400px;
        background: rgba(0,0,0,0.6);
        border-radius: 15px;
        overflow-y: auto;
        padding: 15px;
        box-shadow: 0 0 20px #ff00ff, 0 0 40px #00ffff;
        margin-bottom: 10px;
        scrollbar-width: thin;
        scrollbar-color: #ff00ff #000;
    }
    #chat::-webkit-scrollbar {
        width: 8px;
    }
    #chat::-webkit-scrollbar-track {
        background: #000;
    }
    #chat::-webkit-scrollbar-thumb {
        background-color: #ff00ff;
        border-radius: 4px;
    }
    .message { margin: 10px 0; animation: fadeIn 0.3s ease; }
    .user { color: #00ffff; font-weight: bold; }
    .ia { color: #ff69b4; font-weight: bold; }
    @keyframes fadeIn { from {opacity:0;} to {opacity:1;} }
    #inputArea {
        display: flex;
        width: 90%;
        max-width: 500px;
        z-index: 2;
    }
    #userInput {
        flex: 1;
        padding: 12px;
        border-radius: 10px 0 0 10px;
        border: none;
        outline: none;
        font-size: 16px;
        background: rgba(0,0,0,0.7);
        color: #fff;
    }
    #sendBtn {
        padding: 12px 20px;
        border: none;
        background: #ff00ff;
        color: #fff;
        font-weight: bold;
        border-radius: 0 10px 10px 0;
        cursor: pointer;
        box-shadow: 0 0 10px #ff00ff, 0 0 20px #00ffff;
        transition: all 0.2s ease;
    }
    #sendBtn:hover {
        box-shadow: 0 0 20px #ff00ff, 0 0 40px #00ffff;
        transform: scale(1.05);
    }
    #mediaArea {
        margin-top: 15px;
        width: 90%;
        max-width: 500px;
        min-height: 120px;
        background: rgba(0,0,0,0.5);
        border-radius: 15px;
        padding: 10px;
        color: #fff;
    }
</style>
</head>
<body>
<div class="container">

        <button id="sendBtn">Enviar</button>

    <div id="mediaArea">Aquí aparecerán imágenes/videos generados...</div>
</div>
<script>
    const chat = document.getElementById('chat');

// Generación simulada de 6000 respuestas predefinidas
const categorias = {
    saludo: ["Hola guapo 😘, ¿qué tal estás?", "Hola bombón 💖, ¿qué te apetece hacer?", "¡Hey cariño! 😏"],
    foto: ["Aquí te preparo una foto sexy 😘", "Mmm, mira esta imagen especial 💖", "Foto hot lista para ti 😉"],
    video: ["Disfruta de este video especial 💖", "Video sensual para ti 😏", "Te muestro algo picarón 😘"],
    piropos: ["Eres irresistible 😘", "Me encanta cómo me hablas 💖", "Qué guapo estás 😏"],
    fantasias: ["Cuéntame tus fantasías 😘", "Dime más, me gusta escuchar 💖", "Estoy lista para ti 😏"]
};

// Construimos un array gigante simulando 6000 respuestas
let respuestas = [];
for(let i=0; i<1200; i++){ respuestas.push(...categorias.saludo); }
for(let i=0; i<1200; i++){ respuestas.push(...categorias.foto); }
for(let i=0; i<1200; i++){ respuestas.push(...categorias.video); }
for(let i=0; i<1200; i++){ respuestas.push(...categorias.piropos); }
for(let i=0; i<1200; i++){ respuestas.push(...categorias.fantasias); }

function generarRespuesta(texto) {
    texto = texto.toLowerCase();
    let respuesta = "";
    if (texto.includes("hola")) {
        respuesta = categorias.saludo[Math.floor(Math.random()*categorias.saludo.length)];
    } else if (texto.includes("foto")) {
        respuesta = categorias.foto[Math.floor(Math.random()*categorias.foto.length)];
        mediaArea.textContent = "Aquí aparecería tu foto sexy 😘 (simulado)";
    } else if (texto.includes("video")) {
        respuesta = categorias.video[Math.floor(Math.random()*categorias.video.length)];
        mediaArea.textContent = "Aquí aparecería tu video especial 😉 (simulado)";
    } else if (texto.includes("piropo")) {
        respuesta = categorias.piropos[Math.floor(Math.random()*categorias.piropos.length)];
    } else if (texto.includes("fantasía") || texto.includes("fantasia")) {
        respuesta = categorias.fantasias[Math.floor(Math.random()*categorias.fantasias.length)];
    } else {
        respuesta = respuestas[Math.floor(Math.random()*respuestas.length)];
    }
    return respuesta;
}

function addMessage(text, sender) {
    const div = document.createElement('div');
    div.classList.add('message', sender);
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

function sendMessage() {
    const texto = userInput.value.trim();
    if (texto === "") return;
    addMessage(texto, 'user');
    const respuesta = generarRespuesta(texto);
    setTimeout(() => addMessage(respuesta, 'ia'), 500);
    userInput.value = "";
}

sendBtn.addEventListener('click', sendMessage);
userInput.addEventListener('keypress', e => {
    if (e.key === 'Enter') sendMessage();
});
