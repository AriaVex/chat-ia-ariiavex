<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat IA AriiAvex</title>
<style>
    body {
        margin: 0;
        font-family: 'Arial', sans-serif;
        background-image: url('https://Ariavex.github.io/chat-ia-ariiavex/images/imagesfondo.jpg');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        color: #fff;
    }
    .chat-container {
        max-width: 500px;
        margin: 50px auto;
        background: rgba(0,0,0,0.7);
        padding: 20px;
        border-radius: 15px;
        box-shadow: 0 0 20px #ff00ff, 0 0 40px #00ffff;
    }
    .messages {
        height: 400px;
        overflow-y: auto;
        padding: 10px;
        border: 1px solid #ff00ff;
        border-radius: 10px;
        background: rgba(0,0,0,0.5);
    }
    .message {
        margin: 10px 0;
        padding: 8px 12px;
        border-radius: 15px;
    }
    .user {
        background-color: #ff00ff;
        color: #fff;
        text-align: right;
    }
    .ia {
        background-color: #00ffff;
        color: #000;
        text-align: left;
    }
    input[type=text] {
        width: calc(100% - 90px);
        padding: 10px;
        border-radius: 15px;
        border: none;
        margin-right: 10px;
        outline: none;
    }
    button {
        padding: 10px 15px;
        border-radius: 15px;
        border: none;
        background: linear-gradient(45deg, #ff00ff, #00ffff);
        color: #fff;
        cursor: pointer;
        font-weight: bold;
    }
    button:hover {
        box-shadow: 0 0 10px #ff00ff, 0 0 20px #00ffff;
    }
</style>
</head>
<body>
<div class="chat-container">
    <h2 style="text-align:center; color:#ff00ff;">Chat AriiAvex IA</h2>
    <div class="messages" id="messages"></div>
    <div style="margin-top:10px;">
        <input type="text" id="userInput" placeholder="Escribe algo...">
        <button onclick="sendMessage()">Enviar</button>
    </div>
</div>

<script>
    const messagesDiv = document.getElementById('messages');

    const respuestas = [
        { keywords: ["hola","hey","buenas"], response: "Hola guapo 😘, ¿qué tal estás? ¿Qué te apetece hacer hoy?" },
        { keywords: ["como estas","que tal"], response: "Estoy fantástica 😏, ¿y tú? Cuéntame algo travieso..." },
        { keywords: ["quiero ver"], response: "Mmm... eso suena interesante 😏, dime más detalles..." },
        { keywords: ["adios","hasta luego"], response: "Hasta luego guapo 😘, espero que volvamos a hablar pronto 💖." },
        { keywords: ["default"], response: "Wow 😏, cuéntame más sobre eso..." }
    ];

    function getResponse(input) {
        input = input.toLowerCase();
        for (let i = 0; i < respuestas.length; i++) {
            const kw = respuestas[i].keywords;
            for (let j = 0; j < kw.length; j++) {
                if (input.includes(kw[j])) return respuestas[i].response;
            }
        }
        return respuestas.find(r => r.keywords.includes("default")).response;
    }

    function sendMessage() {
        const input = document.getElementById('userInput').value;
        if(!input) return;
        const userMsgDiv = document.createElement('div');
        userMsgDiv.className = 'message user';
        userMsgDiv.innerText = input;
        messagesDiv.appendChild(userMsgDiv);

        const iaMsgDiv = document.createElement('div');
        iaMsgDiv.className = 'message ia';
        iaMsgDiv.innerText = getResponse(input);
        messagesDiv.appendChild(iaMsgDiv);

        messagesDiv.scrollTop = messagesDiv.scrollHeight;
        document.getElementById('userInput').value = '';
    }
</script>

</body>
</html>
