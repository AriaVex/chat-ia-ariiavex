<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat IA Ariiavex</title>
<style>
    body {
        margin: 0;
        font-family: 'Arial', sans-serif;
        background: url('images/imagesfondo.jpg') no-repeat center center fixed;
        background-size: cover;
        color: #fff;
        overflow-x: hidden;
    }
    .chat-container {
        width: 90%;
        max-width: 800px;
        margin: 50px auto;
        background: rgba(0,0,0,0.6);
        border-radius: 15px;
        padding: 20px;
        box-shadow: 0 0 20px #ff00ff, 0 0 40px #00ffff;
    }
    .messages {
        height: 400px;
        overflow-y: auto;
        border: 1px solid #ff00ff;
        padding: 10px;
        border-radius: 10px;
        margin-bottom: 20px;
        background: rgba(0,0,0,0.4);
    }
    .user-msg {
        text-align: right;
        margin: 5px 0;
    }
    .bot-msg {
        text-align: left;
        margin: 5px 0;
    }
    .msg-input {
        width: 100%;
        padding: 10px;
        border-radius: 10px;
        border: 2px solid #00ffff;
        outline: none;
        font-size: 16px;
        background: rgba(0,0,0,0.6);
        color: #fff;
    }
    .send-btn {
        background: linear-gradient(90deg, #ff00ff, #00ffff);
        border: none;
        color: #fff;
        padding: 10px 20px;
        margin-top: 10px;
        border-radius: 10px;
        cursor: pointer;
        font-size: 16px;
        transition: 0.3s;
    }
    .send-btn:hover {
        filter: brightness(1.3);
    }
</style>
</head>
<body>
<div class="chat-container">
    <h2 style="text-align:center;">Chat con Ariiavex 💖</h2>
    <div class="messages" id="chatBox"></div>
    <input type="text" id="userInput" class="msg-input" placeholder="Escribe tu mensaje...">
    <button class="send-btn" onclick="sendMessage()">Enviar</button>
</div>

<script>
const chatBox = document.getElementById('chatBox');
const userInput = document.getElementById('userInput');

// Array de respuestas predefinidas por categoría
const respuestas = {
    saludo: [
        "Hola guapo 😘, ¿qué tal estás?",
        "Hey cariño 😏, ¿qué quieres hacer hoy?",
        "Hola corazón 💖, cuéntame cómo te sientes."
    ],
    coqueteo: [
        "Mmm 😏 me gusta cómo me hablas.",
        "Jajaja 💋 eres travieso, ¿verdad?",
        "Oh 😘 me encanta tu manera de decir eso."
    ],
    cumplido: [
        "Aww 🥰 gracias por decir eso.",
        "Qué dulce 😘, me haces sonrojar.",
        "Me encanta cuando eres así 💖."
    ],
    triste: [
        "Oh 😔 no me gusta verte así, dime más.",
        "No te preocupes 💕, estoy aquí para ti.",
        "Todo estará bien 😘, confía en mí."
    ],
    default: [
        "Cuéntame más 😏",
        "Oh sí 😘, dime más detalles.",
        "Jajaja 💖 interesante, sigue contándome."
    ]
};

// Función para detectar categoría
function detectarCategoria(mensaje) {
    mensaje = mensaje.toLowerCase();
    if (mensaje.includes("hola") || mensaje.includes("hey") || mensaje.includes("buenos")) return "saludo";
    if (mensaje.includes("guapo") || mensaje.includes("bonito") || mensaje.includes("lindo")) return "cumplido";
    if (mensaje.includes("triste") || mensaje.includes("mal") || mensaje.includes("deprimido")) return "triste";
    if (mensaje.includes("coquetear") || mensaje.includes("sexi") || mensaje.includes("provocativo")) return "coqueteo";
    return "default";
}

// Función para enviar mensaje
function sendMessage() {
    const userMsg = userInput.value.trim();
    if (!userMsg) return;
    chatBox.innerHTML += `<div class="user-msg">${userMsg}</div>`;
    userInput.value = '';
    chatBox.scrollTop = chatBox.scrollHeight;

    // Selección de respuesta
    const categoria = detectarCategoria(userMsg);
    const posibles = respuestas[categoria];
    const botMsg = posibles[Math.floor(Math.random() * posibles.length)];

    chatBox.innerHTML += `<div class="bot-msg">${botMsg}</div>`;
    chatBox.scrollTop = chatBox.scrollHeight;
}
</script>

</body>
</html>
