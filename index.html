<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat IA AriaVex</title>
<style>
    body {
        margin: 0;
        font-family: 'Arial', sans-serif;
        background: url('images/imagesfondo.jpg') no-repeat center center fixed;
        background-size: cover;
        color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        flex-direction: column;
    }
    #chatBox {
        width: 90%;
        max-width: 600px;
        height: 70%;
        background: rgba(0,0,0,0.6);
        border-radius: 20px;
        overflow-y: auto;
        padding: 20px;
        box-shadow: 0 0 20px #ff00ff, 0 0 40px #ff00ff inset;
    }
    #userInput {
        width: 80%;
        padding: 10px;
        border-radius: 10px;
        border: none;
        margin-right: 10px;
        outline: none;
    }
    #sendBtn {
        padding: 10px 20px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(45deg, #ff00ff, #00ffff);
        color: #fff;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 0 10px #ff00ff, 0 0 20px #00ffff inset;
    }
    .message {
        margin-bottom: 15px;
        padding: 10px;
        border-radius: 10px;
    }
    .userMsg { background: rgba(255,255,255,0.2); text-align: right;}
    .iaMsg { background: rgba(255,0,255,0.2); text-align: left;}
</style>
</head>
<body>
<div id="chatBox"></div>
<div style="margin-top:20px;">
    <input type="text" id="userInput" placeholder="Escribe aquí...">
    <button id="sendBtn">Enviar</button>
</div>

<script>
// Arrays con 6000 frases únicas y provocativas (ejemplo resumido, expandirías a todas)
const respuestas = [
  "Hola guapo 😘 ¿Qué te apetece hacer hoy?",
  "Mmm, cuéntame más de ti 💖",
  "Me encanta que me hables así 😏",
  "Wow, eso suena excitante 😈",
  "Qué travieso eres 😘",
  "Me gusta cuando me dices cosas así 💕",
  "Cuéntame tus fantasías 😏",
  "Jajaja eres irresistible 😍",
  "No puedo dejar de pensar en ti 💖",
  "Eso suena delicioso 😈",
  // ...aquí seguirían todas las demás hasta 6000
];

// Función simple de búsqueda de palabras clave para respuestas coherentes
function generarRespuesta(mensaje) {
    mensaje = mensaje.toLowerCase();
    // palabras clave de ejemplo
    if(mensaje.includes("hola")) return respuestas[0];
    if(mensaje.includes("como estas")) return respuestas[1];
    if(mensaje.includes("quiero")) return respuestas[2];
    if(mensaje.includes("fantasía")) return respuestas[6];
    if(mensaje.includes("travesura")) return respuestas[4];
    // si no hay coincidencia, devuelve respuesta aleatoria
    return respuestas[Math.floor(Math.random() * respuestas.length)];
}

const chatBox = document.getElementById('chatBox');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');

function enviarMensaje() {
    const mensaje = userInput.value.trim();
    if(mensaje === "") return;
    const userDiv = document.createElement('div');
    userDiv.classList.add('message', 'userMsg');
    userDiv.textContent = mensaje;
    chatBox.appendChild(userDiv);

    const iaDiv = document.createElement('div');
    iaDiv.classList.add('message', 'iaMsg');
    iaDiv.textContent = generarRespuesta(mensaje);
    chatBox.appendChild(iaDiv);

    chatBox.scrollTop = chatBox.scrollHeight;
    userInput.value = "";
}

sendBtn.addEventListener('click', enviarMensaje);
userInput.addEventListener('keypress', function(e) {
    if(e.key === 'Enter') enviarMensaje();
});
</script>

</body>
</html>
