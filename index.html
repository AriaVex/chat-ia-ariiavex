<!DOCTYPE html>

<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Chat IA AriaVex</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Roboto', sans-serif;
      background: url('images/imagesfondo.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #fff;
    }
    .chat-container {
      max-width: 600px;
      margin: 100px auto;
      background: rgba(0,0,0,0.7);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 0 20px #ff00ff;
    }
    .chat-box {
      height: 400px;
      overflow-y: auto;
      padding: 10px;
      border: 2px solid #ff00ff;
      border-radius: 10px;
      margin-bottom: 10px;
      background: rgba(0,0,0,0.5);
    }
    .user-message { color: #00ffff; margin: 5px 0; }
    .bot-message { color: #ff69b4; margin: 5px 0; }
    input[type=text] {
      width: 80%;
      padding: 10px;
      border-radius: 10px;
      border: none;
      outline: none;
    }
    button {
      width: 18%;
      padding: 10px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(45deg,#ff00ff,#ff69b4);
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-box" id="chatBox"></div>
    <input type="text" id="userInput" placeholder="Escribe un mensaje...">
    <button onclick="enviarMensaje()">Enviar</button>
  </div>

  <script>
    const respuestas = [
      { palabras: ["hola", "buenos días"], respuesta: "Hola guapo 😘 ¿Qué tal estás?" },
      { palabras: ["sexy", "guapo"], respuesta: "Gracias 😏 Cuéntame qué te apetece hacer..." },
      { palabras: ["quiero foto"], respuesta: "Claro, puedo enviarte algo bonito 😘" },
      { palabras: ["video"], respuesta: "Tengo un video especial para ti 😘" },
      { palabras: ["cómo estás"], respuesta: "Estoy bien 😏 ¿y tú, guapo?" }
      // Puedes añadir aquí miles de respuestas más
    ];

    function obtenerRespuesta(mensaje) {
      mensaje = mensaje.toLowerCase();
      for (let i = 0; i < respuestas.length; i++) {
        for (let palabra of respuestas[i].palabras) {
          if (mensaje.includes(palabra)) {
            return respuestas[i].respuesta;
          }
        }
      }
      return "Wuaw 😏 cuéntame más sobre eso...";
    }

    function enviarMensaje() {
      const input = document.getElementById("userInput");
      const chatBox = document.getElementById("chatBox");
      const userText = input.value.trim();
      if (userText === "") return;

      // Mostrar mensaje del usuario
      chatBox.innerHTML += `<div class="user-message">Tú: ${userText}</div>`;

      // Obtener respuesta del bot
      const respuesta = obtenerRespuesta(userText);
      chatBox.innerHTML += `<div class="bot-message">AriaVex: ${respuesta}</div>`;

      input.value = "";
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>

</body>
</html>
