<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat IA Sensual</title>
<style>
    body {
        margin: 0;
        font-family: 'Arial', sans-serif;
        background: url('https://onlyfans.com/ariiavex') no-repeat center center fixed;
        background-size: cover;
        color: #fff;
    }
    .chat-container {
        width: 400px;
        max-width: 90%;
        margin: 50px auto;
        background: rgba(0,0,0,0.6);
        border-radius: 15px;
        padding: 20px;
        box-shadow: 0 0 20px #ff00ff, 0 0 40px #00ffff;
    }
    #messages {
        height: 300px;
        overflow-y: auto;
        border: 1px solid #fff;
        padding: 10px;
        border-radius: 10px;
        background: rgba(0,0,0,0.4);
    }
    .message {
        margin: 10px 0;
        padding: 8px;
        border-radius: 10px;
    }
    .user {
        background: #ff00ff;
        color: #fff;
        text-align: right;
    }
    .ia {
        background: #00ffff;
        color: #000;
        text-align: left;
    }
    input, button {
        padding: 10px;
        border-radius: 10px;
        border: none;
        margin-top: 10px;
        width: calc(100% - 22px);
        font-size: 16px;
        outline: none;
    }
    button {
        background: linear-gradient(45deg, #ff00ff, #00ffff);
        color: #fff;
        cursor: pointer;
        transition: 0.3s;
    }
    button:hover {
        box-shadow: 0 0 10px #ff00ff, 0 0 10px #00ffff;
    }
    .ia-typing {
        font-style: italic;
        opacity: 0.7;
    }
    .media {
        margin-top: 10px;
        max-width: 100%;
        border-radius: 10px;
    }
</style>
</head>
<body>
<div class="chat-container">
    <h2>Chat con AriaVex</h2>
    <div id="messages"></div>
    <input type="text" id="userInput" placeholder="Escribe tu mensaje aquí...">
    <button onclick="sendMessage()">Enviar</button>
</div>

<script>
const messages = document.getElementById('messages');
const userInput = document.getElementById('userInput');

// Simulación de 6000 respuestas predefinidas (aquí resumido, expandir según necesites)
const iaResponses = [
    "Hola guapo 😘, ¿qué tal estás?",
    "Me encanta que me hables así 💖",
    "¿Quieres ver una foto especial? 😏",
    "Eres muy travieso 😈",
    "Cuéntame tus fantasías...",
    "Mmm... eso suena muy bien 😘",
    "Estoy lista para jugar contigo 😏",
    "Eres irresistible 💕",
    "Me encanta hablar contigo 😍",
    "Dime algo atrevido 😈"
    // Añadir más hasta 6000
];

function randomResponse() {
    const index = Math.floor(Math.random() * iaResponses.length);
    return iaResponses[index];
}

function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;

    // Mensaje del usuario
    const userMsg = document.createElement('div');
    userMsg.classList.add('message','user');
    userMsg.textContent = text;
    messages.appendChild(userMsg);
    messages.scrollTop = messages.scrollHeight;
    userInput.value = '';

    // Mensaje de "IA escribiendo..."
    const iaTyping = document.createElement('div');
    iaTyping.classList.add('message','ia','ia-typing');
    iaTyping.textContent = 'AriaVex está escribiendo...';
    messages.appendChild(iaTyping);
    messages.scrollTop = messages.scrollHeight;

    // Respuesta de la IA simulada
    setTimeout(() => {
        messages.removeChild(iaTyping);

        const iaMsg = document.createElement('div');
        iaMsg.classList.add('message','ia');

        // Generar respuesta
        let response = randomResponse();

        // Simular envío de foto o video
        if (text.toLowerCase().includes('foto')) {
            response = '';
            const img = document.createElement('img');
            img.src = 'https://via.placeholder.com/300x200.png?text=Foto+Sensual';
            img.classList.add('media');
            iaMsg.appendChild(img);
        } else if (text.toLowerCase().includes('video')) {
            response = '';
            const video = document.createElement('video');
            video.src = 'https://www.w3schools.com/html/mov_bbb.mp4';
            video.controls = true;
            video.classList.add('media');
            iaMsg.appendChild(video);
        } else {
            iaMsg.textContent = response;
        }

        messages.appendChild(iaMsg);
        messages.scrollTop = messages.scrollHeight;
    }, 1500); // Tiempo de “escribiendo”
}
</script>

</body>
</html>
