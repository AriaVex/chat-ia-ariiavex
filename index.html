/* Contenedor principal */
.container {

    display:flex;
    flex-direction:column;
    height:100%;
    justify-content:center;
    align-items:center;

}

@keyframes fadeIn {
    from { opacity: 0; }

}

#chat {
    width: 90%;
    max-width: 500px;
    height: 400px;
    background: rgba(0,0,0,0.6);
    border-radius: 15px;
    overflow-y: auto;
    padding: 15px;
    box-shadow: 0 0 20px #ff00ff, 0 0 40px #00ffff;

    transition: box-shadow 0.5s;
}

</style>

<body>
<div class="container">
    <div id="chat"></div>
    <div id="inputArea">
        <input type="text" id="userInput" placeholder="Escribe tu mensaje...">
        <button id="sendBtn">Enviar</button>
    </div>
    <div id="mediaArea">Aquí aparecerán imágenes/videos generados...</div>
</div>

<script>
    const chat = document.getElementById('chat');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const mediaArea = document.getElementById('mediaArea');

    // Plantillas y palabras clave
    const saludos = ["Hola guapo", "Hey cariño", "Hola bombón"];
    const preguntas = ["¿qué tal estás?", "¿qué haces hoy?", "¿qué te apetece hacer?", "¿cómo te sientes hoy?"];
    const despedidas = ["💖", "😉", "😏"];
    const fotos = ["¡Perfecto! Te voy a generar una foto sexy 😘", "Mira esto que te preparé 💕"];
    const videos = ["Te voy a mostrar un video especial 💖", "Disfruta de este video 😉"];
    
    // Función de respuesta
    function generarRespuesta(texto) {
        texto = texto.toLowerCase();
        let respuesta = "";
        if (texto.includes("hola")) {
            respuesta = `${saludos[Math.floor(Math.random()*saludos.length)]}, ${preguntas[Math.floor(Math.random()*preguntas.length)]} ${despedidas[Math.floor(Math.random()*despedidas.length)]}`;
        } else if (texto.includes("foto")) {
            respuesta = fotos[Math.floor(Math.random()*fotos.length)];
            mediaArea.textContent = "Aquí aparecería tu foto sexy 😘 (simulada)";
        } else if (texto.includes("video")) {
            respuesta = videos[Math.floor(Math.random()*videos.length)];
            mediaArea.textContent = "Aquí aparecería tu video especial 😉 (simulado)";
        } else if (texto.includes("como estas")) {
            respuesta = `${saludos[Math.floor(Math.random()*saludos.length)]}, todo bien 😘 ¿y tú?`;
        } else {
            // Respuesta genérica aleatoria
            respuesta = `${saludos[Math.floor(Math.random()*saludos.length)]}, dime más 😏`;
        }
        return respuesta;
    }

    function addMessage(text, sender) {
        const div = document.createElement('div');
        div.classList.add('message', sender);
        div.textContent = text;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    function sendMessage() {
        const texto = userInput.value.trim();
        if(texto === "") return;
        addMessage(texto, 'user');
        const respuesta = generarRespuesta(texto);
        setTimeout(()=> addMessage(respuesta, 'ia'), 500);
        userInput.value = "";
    }

    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keypress', (e)=> {
        if(e.key === 'Enter') sendMessage();
    });
</script>

</body>
